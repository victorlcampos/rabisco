name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publica o Rabisco.app
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Confere se a tag bate com a versão do Cargo.toml
        run: |
          versao=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $versao do Cargo.toml" >&2
            exit 1
          fi

      - name: Toolchain com os alvos Apple Silicon e Intel
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Gera o Rabisco.app universal, o Rabisco.dmg e o Rabisco.zip
        run: |
          UNIVERSAL=1 ./scripts/bundle.sh
          ./scripts/dmg.sh
          ditto -c -k --keepParent target/Rabisco.app target/Rabisco.zip
          # O `rabisco update` só instala o Rabisco.zip que bater com este SHA-256.
          (cd target && shasum -a 256 Rabisco.dmg Rabisco.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Cria a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/Rabisco.dmg target/Rabisco.zip target/SHA256SUMS --title "Rabisco $GITHUB_REF_NAME" --generate-notes
