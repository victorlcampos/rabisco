    <mask id="recortes" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <g transform="translate(-9.7 -6.4) scale(.0486)">
        <!-- olho e contorno da orelha vazados -->
        <circle cx="764" cy="398" r="28" fill="#000"/>
        <path d="M690 312C628 316 590 378 600 468C604 512 646 526 668 490C694 448 712 372 690 312Z" fill="none" stroke="#000" stroke-width="26"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#recortes)">
    <g transform="translate(-9.7 -6.4) scale(.0486)">
