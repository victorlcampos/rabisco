      <rect x="556" y="636" width="56" height="152" rx="28"/>
      <path d="M352 548C300 520 262 456 262 380" fill="none" stroke="#000" stroke-width="56" stroke-linecap="round"/>
      <path d="M345 530C420 505 540 505 612 510C640 512 655 498 668 478L760 520C772 566 760 630 716 664C690 684 660 700 620 704C550 708 460 700 400 706C350 712 318 690 316 640C314 590 322 548 345 530Z"/>
      <rect x="340" y="648" width="62" height="146" rx="31"/>
      <rect x="598" y="648" width="62" height="146" rx="31"/>
      <circle cx="720" cy="424" r="122"/>
      <ellipse cx="818" cy="468" rx="82" ry="58"/>
    </g>
  </g>
</svg>
